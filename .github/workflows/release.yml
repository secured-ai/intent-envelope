name: Release to PyPI

# Publishes packages/python when a GitHub release is published.
# Authentication is PyPI Trusted Publishing over OIDC: no API token is stored
# in this repository, and nothing to leak or rotate.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/python --outdir dist
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Verify the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('packages/python/pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION"; exit 1
          fi
          echo "version $VERSION matches tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
