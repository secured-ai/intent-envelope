name: Release to PyPI

# Publishes packages/python when a GitHub release is published.
# Authentication is PyPI Trusted Publishing over OIDC: no API token is stored
# in this repository, and nothing to leak or rotate.
# Actions are pinned to commit SHAs, kept current by Dependabot.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/python --outdir dist
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Verify the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('packages/python/pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION"; exit 1
          fi
          echo "version $VERSION matches tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
