name: Release to PyPI

# Publishes packages/python when a GitHub release is published.
# Authentication is PyPI Trusted Publishing over OIDC: no API token is stored
# in this repository, and nothing to leak or rotate.
# Actions are pinned to commit SHAs, kept current by Dependabot.
#
# workflow_dispatch runs everything except the publish: the build, the metadata
# check, and the artifact handoff between the two jobs. Nothing else in this
# repository exercises this file, so a change to it is otherwise first tested by
# cutting a real release, which is the worst place to discover a mistake.
# Run it from Actions, "Release to PyPI", Run workflow, against any branch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/python --outdir dist
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('packages/python/pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION"; exit 1
          fi
          echo "version $VERSION matches tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Only on a dispatch, because on a release the publish job proves the same thing
  # by doing it. This is what makes a bump of upload-artifact or download-artifact
  # testable: those two have to agree with each other, and nothing else here checks
  # that the dist built in one job arrives intact in the next.
  verify-artifact-roundtrip:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The wheel and the sdist survived the handoff
        run: |
          ls -l dist/
          ls dist/*.whl >/dev/null 2>&1 || { echo "no wheel in the downloaded artifact"; exit 1; }
          ls dist/*.tar.gz >/dev/null 2>&1 || { echo "no sdist in the downloaded artifact"; exit 1; }
          echo "upload-artifact and download-artifact agree"

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
