name: Release to npm

# Stages packages/typescript when a GitHub release is published. It does not publish.
#
# This workflow cannot make anything installable on its own, by design. `npm stage
# publish` puts the tarball in a queue that the public cannot install from, and a
# maintainer then runs `npm stage approve <stage-id>` and answers a 2FA challenge to
# release it. A compromised workflow, a stolen OIDC token or a bad merge can therefore
# queue a release, but cannot ship one. For a package whose whole job is enforcing
# what an agent may do, that is the right shape: the same argument this project makes
# about agents applies to its own release pipeline.
#
# The npm trusted publisher for this package is configured stage-only, so `npm
# publish` from here is rejected by the registry rather than merely discouraged.
#
# Authentication is npm Trusted Publishing over OIDC, so no NPM_TOKEN is stored in
# this repository. Staging never prompts for 2FA, which is what lets it run
# unattended; approval always does, which is what makes it a gate.
#
# RELEASING.md has the approval steps and the one-time setup.
#
# Actions are pinned to commit SHAs, kept current by Dependabot.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Types, suite and packaged install
        run: |
          npm run typecheck
          npm test
          npm run smoke
      - name: Verify the tag matches the package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          echo "version $VERSION matches tag"

  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/typescript
    permissions:
      # The critical requirement: without this, npm cannot get an OIDC token and the
      # staging falls back to looking for a credential that is deliberately absent.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs 11.5.1 or newer; the stage subcommands need 11.15.
      - name: npm 11.15 or newer is required for staging
        run: |
          npm install -g npm@^11.15.0
          npm --version
      - name: Install
        run: npm ci
      # prepack builds dist, so the tarball is the one the smoke test exercised.
      # --provenance is explicit rather than relied upon: it is what lets anyone
      # verify the tarball was built from this commit, and a release that silently
      # lost its attestation would be worse than one that failed to stage.
      - name: Stage for a maintainer to approve
        run: npm stage publish --access public --provenance
      - name: Say what has to happen next
        run: |
          echo "Staged. Nothing is installable yet."
          echo "Approve it with 2FA:"
          echo "  npm stage list intent-envelope"
          echo "  npm stage approve <stage-id>"
          echo "Or reject it:  npm stage reject <stage-id>"
