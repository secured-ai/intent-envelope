name: CI

# Actions are pinned to commit SHAs. A tag can be moved to point at different code;
# a SHA cannot. Dependabot keeps these current and raises a PR when one moves.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/python pytest
      - name: Schema parses
        run: python -c "import json,pathlib;json.loads(pathlib.Path('schema/intent-envelope-0.1.json').read_text());print('schema ok')"
      - name: Conformance fixtures
        run: python -m pytest packages/python/tests -q
      - name: CLI accepts every example
        run: intent-envelope validate examples/*.json
      - name: CLI rejects every invalid fixture
        run: |
          for f in conformance/invalid/*.json; do
            if intent-envelope validate "$f" 2>/dev/null; then
              echo "FAIL: $f was accepted and should not have been"; exit 1
            fi
          done
          echo "all invalid fixtures rejected"

  schema-copy-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The packaged schema must match the canonical one
        run: |
          diff -u schema/intent-envelope-0.1.json \
                  packages/python/src/intent_envelope/schema/intent-envelope-0.1.json \
            || { echo "The copy under packages/python has drifted from schema/. Copy it across."; exit 1; }
          echo "schema copy matches"

  # One stable name for branch protection to require. The matrix can gain or lose a
  # Python version without the ruleset silently waiting on a check name that no
  # longer exists. always() matters: without it this job is skipped when a
  # dependency fails, and a skipped required check never reports a failure.
  all-checks-passed:
    if: always()
    needs: [conformance, schema-copy-matches]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          echo "conformance:        ${{ needs.conformance.result }}"
          echo "schema-copy-matches: ${{ needs['schema-copy-matches'].result }}"
          if [ "${{ needs.conformance.result }}" != "success" ] || \
             [ "${{ needs['schema-copy-matches'].result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
          echo "All required checks passed."
