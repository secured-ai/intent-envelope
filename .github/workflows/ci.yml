name: CI

# Actions are pinned to commit SHAs. A tag can be moved to point at different code;
# a SHA cannot. Dependabot keeps these current and raises a PR when one moves.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/python pytest
      - name: Schema parses
        run: python -c "import json,pathlib;json.loads(pathlib.Path('schema/intent-envelope-0.1.json').read_text());print('schema ok')"
      - name: Conformance fixtures
        run: python -m pytest packages/python/tests -q
      - name: CLI accepts every example
        run: intent-envelope validate examples/*.json
      - name: CLI rejects every invalid fixture
        run: |
          for f in conformance/invalid/*.json; do
            if intent-envelope validate "$f" 2>/dev/null; then
              echo "FAIL: $f was accepted and should not have been"; exit 1
            fi
          done
          echo "all invalid fixtures rejected"

  schema-copy-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The packaged schema must match the canonical one
        run: |
          diff -u schema/intent-envelope-0.1.json \
                  packages/python/src/intent_envelope/schema/intent-envelope-0.1.json \
            || { echo "The copy under packages/python has drifted from schema/. Copy it across."; exit 1; }
          echo "schema copy matches"
