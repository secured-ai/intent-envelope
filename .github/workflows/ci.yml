name: CI

# Actions are pinned to commit SHAs. A tag can be moved to point at different code;
# a SHA cannot. Dependabot keeps these current and raises a PR when one moves.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/python pytest
      - name: Schema parses
        run: python -c "import json,pathlib;json.loads(pathlib.Path('schema/intent-envelope-0.1.json').read_text());print('schema ok')"
      - name: Conformance fixtures
        run: python -m pytest packages/python/tests -q
      - name: CLI accepts every example
        run: intent-envelope validate examples/*.json
      # The suite imports from the source tree. This builds the real artifacts and
      # installs the wheel into a clean venv, which is the check that would have
      # caught 0.0.1 going to PyPI without the evaluator or enforcement point.
      - name: The packaged install works
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python packages/python/tools/consumer_smoke.py
      - name: CLI rejects every invalid fixture
        run: |
          for f in conformance/invalid/*.json; do
            if intent-envelope validate "$f" 2>/dev/null; then
              echo "FAIL: $f was accepted and should not have been"; exit 1
            fi
          done
          echo "all invalid fixtures rejected"

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
      - name: Install
        run: npm ci
      - name: Types, including the tests
        run: npm run typecheck
      - name: Conformance cases and enforcement suite
        run: npm test
      # The suite runs against the source tree, where Node strips types happily. It
      # cannot see the failure that matters at publish time: Node refuses to strip
      # types under node_modules, so a package pointing at its own .ts sources throws
      # on a consumer's first import. This packs, installs and makes a decision.
      - name: The packaged install works
        run: npm run smoke

  # Each package passing its own suite proves only that it agrees with itself. This
  # runs both over the same case files and diffs the answers, which is the claim the
  # specification makes: an envelope means the same thing whichever point reads it.
  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/python
      - name: Both implementations decide every case the same way
        run: node tools/cross-check.mjs

  schema-copy-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The packaged schema must match the canonical one
        run: |
          diff -u schema/intent-envelope-0.1.json \
                  packages/python/src/intent_envelope/schema/intent-envelope-0.1.json \
            || { echo "The copy under packages/python has drifted from schema/. Copy it across."; exit 1; }
          echo "schema copy matches"

  # The two packages are one release at one version. Checked on every pull request
  # rather than only at release time, because discovering it from a failed publish
  # means a tag already exists for a version that cannot ship.
  versions-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
      - name: Python, TypeScript and the module all declare the same version
        run: |
          PY=$(grep -m1 -oP '^version = "\K[^"]+' packages/python/pyproject.toml)
          MOD=$(grep -m1 -oP '^__version__ = "\K[^"]+' packages/python/src/intent_envelope/__init__.py)
          TS=$(node -p "require('./packages/typescript/package.json').version")
          TSMOD=$(grep -m1 -oP "VERSION = '\K[^']+" packages/typescript/src/index.ts)
          echo "pyproject.toml      $PY"
          echo "__init__.py         $MOD"
          echo "package.json        $TS"
          echo "src/index.ts        $TSMOD"
          if [ "$PY" != "$MOD" ] || [ "$PY" != "$TS" ] || [ "$TS" != "$TSMOD" ]; then
            echo "These must all agree. A release tags one version for both packages."
            exit 1
          fi
          echo "all four agree on $PY"

  # One stable name for branch protection to require. The matrix can gain or lose a
  # Python version without the ruleset silently waiting on a check name that no
  # longer exists. always() matters: without it this job is skipped when a
  # dependency fails, and a skipped required check never reports a failure.
  all-checks-passed:
    if: always()
    needs: [conformance, typescript, cross-implementation, schema-copy-matches, versions-agree]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          echo "conformance:          ${{ needs.conformance.result }}"
          echo "typescript:           ${{ needs.typescript.result }}"
          echo "cross-implementation: ${{ needs['cross-implementation'].result }}"
          echo "schema-copy-matches:  ${{ needs['schema-copy-matches'].result }}"
          echo "versions-agree:       ${{ needs['versions-agree'].result }}"
          if [ "${{ needs.conformance.result }}" != "success" ] || \
             [ "${{ needs.typescript.result }}" != "success" ] || \
             [ "${{ needs['cross-implementation'].result }}" != "success" ] || \
             [ "${{ needs['schema-copy-matches'].result }}" != "success" ] || \
             [ "${{ needs['versions-agree'].result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
          echo "All required checks passed."
